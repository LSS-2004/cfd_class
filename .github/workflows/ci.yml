name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Code Style & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install black isort flake8 mypy

      - name: Black format check
        run: black --check --diff src/ tests/

      - name: Isort import sort check
        run: isort --check-only --diff src/ tests/

      - name: Flake8 lint
        run: flake8 src/ tests/ --max-line-length=88 --statistics --show-source

      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports || true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run unit tests with coverage
        run: pytest tests/unit/ -v --cov=src/ --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        run: pytest tests/integration/ -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Check coverage threshold (>=80%)
        run: |
          python -c "
import xml.etree.ElementTree as ET
tree = ET.parse('coverage.xml')
root = tree.getroot()
coverage = float(root.attrib.get('line-rate', 0))
print(f'Coverage: {coverage:.1%}')
if coverage < 0.80:
    print('ERROR: Coverage below 80% threshold!')
    exit(1)
else:
    print('PASS: Coverage meets 80% threshold')
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install safety bandit

      - name: Check dependency vulnerabilities
        run: safety check -r requirements.txt || true

      - name: Bandit security linter
        run: bandit -r src/ -ll || true

  frontend-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install streamlit

    - name: Test Streamlit app imports
      run: |
        python -c "from src.frontend.app import main; print('✅ Main app imports successfully')"
        python -c "from src.frontend.pages import *; print('✅ Pages module imports successfully')"

    - name: Validate Streamlit pages
      run: |
        python -c "
        import streamlit as st
        from pathlib import Path
        pages_dir = Path('src/frontend/pages')
        assert pages_dir.exists(), 'Pages directory not found'
        assert (pages_dir / '1_Simulation.py').exists(), 'Simulation page not found'
        assert (pages_dir / '2_Comparison.py').exists(), 'Comparison page not found'
        assert (pages_dir / '3_Theory.py').exists(), 'Theory page not found'
        print('✅ All Streamlit pages validated')
        "

  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    needs: [test, security, frontend-test]
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: pip install build setuptools wheel

      - name: Build package
        run: python -m build

      - name: Test import
        run: python -c "from src.core.config import DamBreakConfig; print('Import OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  deploy-docs:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
