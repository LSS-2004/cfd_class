name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog for release
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## Version ${{ steps.version.outputs.VERSION }}

          ### 📦 发布内容
          - 标准化仓库结构建立
          - GB/T国标文档框架完成
          - GitHub协作流程配置
          - CI/CD流水线就绪

          ### ✅ 新功能
          - 初始化项目骨架和开发规范

          ### 🔧 改进
          - 建立符合GB/T标准的文档体系

          ### 📝 文档更新
          - SRS需求规格说明书 (框架版)
          - SDD设计说明书 (框架版)
          - CONTRIBUTING贡献者指南
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            dist/*.whl
            dist/*.tar.gz

  docs:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation tools
        run: pip install sphinx sphinx-rtd-theme markdown

      - name: Create docs site from Markdown
        run: |
          mkdir -p docs-site
          cp README.md docs-site/index.md
          cp CHANGELOG.md docs-site/changelog.md
          cp CONTRIBUTING.md docs-site/contributing.md
          cp LICENSE docs-site/license.md
          
          # Copy all documentation
          mkdir -p docs-site/docs
          cp -r docs/* docs-site/docs/
          
          # Create simple navigation
          cat > docs-site/mkdocs.yml << 'EOF'
          site_name: CFD-Class Documentation
          theme:
            name: readthedocs
          nav:
            - Home: index.md
            - Contributing: contributing.md
            - Changelog: changelog.md
            - License: license.md
            - Requirements:
                - docs/requirements/SRS.md
            - Design:
                - docs/design/SDD.md
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs-site/
